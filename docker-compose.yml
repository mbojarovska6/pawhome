services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pawhome
      POSTGRES_PASSWORD: pawhome
      POSTGRES_DB: pawhome
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawhome"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://pawhome:pawhome@db:5432/pawhome   # "db" = the service above
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:3000/api   # the browser calls the API from your computer
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:

# Catalog for the DATA PILE (Tasks 3-4): Iceberg tables in the Silo bucket pawhome-pile.
# Query it as pile.<bronze|silver|gold>.<table>
connector.name=iceberg

# Where Iceberg looks up the tables: the SAME SQLite catalog PyIceberg uses
# (lake/notebooks/pile_catalog/pawhome_silo.db, mounted at /pile_catalog).
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=pawhome_silo
iceberg.jdbc-catalog.driver-class=org.sqlite.JDBC
iceberg.jdbc-catalog.connection-url=jdbc:sqlite:/pile_catalog/pawhome_silo.db
iceberg.jdbc-catalog.connection-user=trino
iceberg.jdbc-catalog.connection-password=trino
iceberg.jdbc-catalog.default-warehouse-dir=s3://pawhome-pile

# The pile is written by dlt / Spark; Trino only reads it.
iceberg.security=read_only

# How to reach the data files in Silo (S3-compatible)
fs.native-s3.enabled=true
s3.endpoint=http://silo:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=silo-admin
s3.aws-secret-key=silo-password-123
